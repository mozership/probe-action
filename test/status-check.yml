name: Status Check Test
description: Test multiple HTTP status codes

jobs:
  - name: Status Tests
    steps:
      - name: Test 200 OK
        uses: http
        with:
          get: http://127.0.0.1:8000/
        test: "res.code == 200"

      - name: Test 404 Not Found
        uses: http
        with:
          get: http://127.0.0.1:8000/nonexistent-page-12345
        test: "res.code == 404"
